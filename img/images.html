<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .photo {
            margin-bottom: 20px;
        }
        .photo img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="photo">
        <img src="mecca.jpg" alt="Photo 1">
    </div>
    <div class="photo">
        <img src="madinah.jpg" alt="Photo 2">
    </div>
    <div class="photo">
        <img src="dubai.jpg" alt="Photo 3">
    </div>
    <div class="photo">
        <img src="singapore.jpg" alt="Photo 3">
    </div>
</div>

</body>
</html>
