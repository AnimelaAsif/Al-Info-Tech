<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Uploader</title>
    <link rel="icon" href="logo.png" type="image/jpg">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('logo.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .uploader {
            background-color: rgba(182, 195, 242, 0.656);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
        }
        .uploader h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .uploader form {
            text-align: center;
        }
        .uploader input[type="file"] {
            display: none;
        }
        .uploader label {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: inline-block;
            margin-bottom: 20px;
        }
        .uploader label:hover {
            background-color: #0056b3;
        }
        .uploader input[type="submit"] {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .uploader input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="uploader">
        <h2>Upload Your Files</h2>
        <form action="Uploader.php" method="post" enctype="multipart/form-data">
            <label for="Upload">Select Files</label>
            <input type="file" name="Upload" id="Upload" multiple onchange="displayFileNames()">
            <br>
            <input type="submit" value="Upload Files">
        </form>
        <p id="file-names"></p>
    </div>

    <script>
        function displayFileNames() {
            var input = document.getElementById('Upload');
            var fileNames = '';
            for (var i = 0; i < input.files.length; i++) {
                fileNames += input.files[i].name + '<br>';
            }
            document.getElementById('file-names').innerHTML = 'Selected files: <br>' + fileNames;
        }
    </script>
</body>
</html>
