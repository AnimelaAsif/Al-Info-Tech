<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique File Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .uploader {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
        }
        .uploader h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .uploader form {
            text-align: center;
        }
        .uploader input[type="file"] {
            display: none;
        }
        .uploader label {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: inline-block;
            margin-bottom: 20px;
        }
        .uploader label:hover {
            background-color: #0056b3;
        }
        .uploader input[type="submit"] {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .uploader input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="uploader">
        <h2>Upload Your File</h2>
        <form action="demo.php" method="post" enctype="multipart/form-data">
            <label for="furesume">Select File</label>
            <input type="file" name="furesume" id="furesume">
            <br>
            <input type="submit" value="Upload File">
        </form>
    </div>
</body>
</html>
