<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Package</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="form.css">
</head>
<body>
<div class="login-box">
    <h2>Book Your Package</h2>
    <form id="form" action="https://script.google.com/macros/s/AKfycbzP8Kw8fWNn0qB7x-S0tSuzb9ELpjZCw9xZvkOuhwJL3dHSJemwzvdm4O9ZUEQYhGvo/exec" method="post" onsubmit="return submitForm(event)">
    <div class="user-box">
        <input type="text" name="" required="">
        <label>Full Name</label>
    </div>
    <div class="user-box">
        <input type="email"; name="" required="">
        <label>Email</label>
    </div>
    <div class="user-box">
        <input type="number" name=""; required="">
        <label>Mobile</label>
    </div>
      <div class="user-box">
        <select name="package"; required>
            <option value="" disabled selected>Select Package Type</option>
            <option value="umrah">Umrah Package</option>
            <option value="dubai">Dubai Package</option>
            <option value="bangkok">Bangkok Package</option>
            <option value="bangkok">Visa Services</option>
        </select>
    </div>
    <!-- <span style="font-size: 16px; color: white;"><p>Departure Date</p></span> -->
    <div class="user-box">
        <input type="date" name="" required>
        <label>Departure Date</label>
    </div>
    <div class="user-box">
        <input type="number" name="" required="">
        <label>No of Adults</label>
    </div>
    <div class="user-box">
        <input type="number" name="" required="">
        <label>No of Children</label>
    </div>
    <div class="text-box-container">
        <input type="text" name="textbox" required>
        <label>Additional Details</label>
    </div>
    <a href="#" onclick="document.getElementById('form').submit(); return false;">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        Submit
    </a>
    </form>
    <script>
        function submitForm(event) {
            event.preventDefault();
            var form = document.getElementById("form");
            var xhr = new XMLHttpRequest();
            xhr.open(form.method, form.action);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
                    form.reset();
                    window.location.reload();
                }
            };
            var formData = new FormData(form);
            var encodedData = new URLSearchParams(formData).toString();
            xhr.send(encodedData);
            return false;
        }
    </script>
  </div>
</body>
