<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Package</title>
    <link rel="icon" href="../img/logo.png" type="image/png">
    <link rel="stylesheet" href="form.css">
</head>
<body>
<div class="login-box">
    <h2>Book Your Package</h2>
    <form id="form" action="https://script.google.com/macros/s/AKfycbyKavR7yFM2M7dlbqlkfIMuiO5UobIBwhQP68KblFYnnLotUXVAFPx0-erxCqmyelVU/exec" method="post" onsubmit="return submitForm(event)">
    <div class="user-box">
        <input type="text" name="name" required>
        <label>Full Name</label>
    </div>
    <div class="user-box">
        <input type="email" name="email" required>
        <label>Email</label>
    </div>
    <div class="user-box">
        <input type="tel" name="phone" id="phone" required="">
        <label for="phone">Mobile</label>
        <span id="phone-error" class="error-message"></span>
    </div>
      <div class="user-box">
        <select for="package" name="package"; required>
            <option value="" disabled selected>Select Package Type</option>
            <option value="Umrah-package">Umrah Package</option>
            <option value="Dubai-package">Dubai Package</option>
            <option value="Bangkok-package">Bangkok Package</option>
            <option value="Visa-service">Visa Services</option>
        </select>
    </div>
    <div class="user-box">
        <input type="date" name="departure" required>
        <label for="departure">Departure Date</label>
    </div>
    <div class="user-box">
        <input type="number" name="adults" required="" min="1">
        <label for="adults">No of Adults</label>
    </div>
    <div class="user-box">
        <input type="number" name="children" required="" min="0">
        <label for="children">No of Children</label>
    </div>
    <div class="text-box-container">
        <input type="text" name="details" required>
        <label for="details">Additional Details</label>
    </div>
    <a href="#" onclick="submitForm(event)">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        Submit
    </a>
    </form>
  </div>
  <script>
    function submitForm() {
        event.preventDefault();
        var form = document.getElementById("form");
        var phoneInput = document.getElementById("phone");
        var phoneError = document.getElementById("phone-error");
        var phoneValue = phoneInput.value.trim();

        if (phoneValue.length != 10 || isNaN(phoneValue)) {
            phoneError.textContent = "Please enter a 10-digit number.";
            return false;
        } else {
            phoneError.textContent = "";
        }
        var inputs = form.querySelectorAll('input[required], select[required]');
        for (var i = 0; i < inputs.length; i++) {
            if (!inputs[i].value) {
                alert("Please fill in all required fields.");
                return false;
            }
        }
        var xhr = new XMLHttpRequest();
        xhr.open(form.method, form.action);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
                form.reset();
                window.location.href = "thanks.html";
            }
        };
        var formData = new FormData(form);
        var encodedData = new URLSearchParams(formData).toString();
        xhr.send(encodedData);
        return false;
    }
</script>
</body>
