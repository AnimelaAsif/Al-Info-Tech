<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="form.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#141e30, #243b55);
          }
  
        .thanks {
            font-size: 30px;
            font-family: sans-serif;
            text-align: center;
            color: #fff;
        }
        .company {
            font-size: 50px;
            font-family: sans-serif;
            text-align: center;
            color: #fff;
            display: block;
        }
        .thumb {
            font-size: 100px;
            text-align: center;
            display: block;
        }
        .img {
            position: absolute;
            height: 120px;
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .button-container {
            display: flex;
            padding: 10px;
            border-radius: 5px;
            justify-content: center;
        }
        .button {
            background-color: rgba(0,0,0,.5);
            align-content: center;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #d42b00;
        }
    </style>
  </head>
  <body>
    <div class="lines">
        <div><img class="img" src="logo.png" alt="logo"></div>
        <div class="thanks">Thanks for showing your Interest at</div>
        <div class="company">Al-Infotech Tours and Travels</div>
        <div class="thumb">👍</div>
        <div class="button-container">
            <p style="color: #fff;">Click here to go back to the home page</p>
            <a href="/var/www/html/Al-Info-Tech/index.html"><button class="button">Home</button></a>
        </div>
    </div>
  </body>
  </html>
